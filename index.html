<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>滬江小學 - 小三數學科：3上B 第15課 平行線互動教學平台</title>
  <style>
    :root {
      --primary-color: #ff8da1;
      --primary-light: #fff0f5;
      --primary-dark: #d85d75;
      --accent-color: #ff6b8b;
      --text-color: #334155;
      --card-bg: #ffffff;
      --border-color: #ffd1dc;
      --inactive-line: #cbd5e1;
      --ai-bg: #fdf5f7;
      --success-green: #16a34a;
      --error-red: #dc2626;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: clamp(10px, 3vw, 24px);
      background-color: var(--primary-light);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 141, 161, 0.2);
      border: 2px solid var(--border-color);
      padding: clamp(16px, 3vw, 28px);
      overflow: hidden;
    }

    header {
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
      position: relative;
    }

    .badge-school {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(1.4rem, 2.8vw, 1.9rem);
      color: var(--primary-dark);
      margin: 0 0 8px 0;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin: 0;
    }

    .mode-switch-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: #ffffff;
      border: 2px solid var(--primary-color);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .mode-switch-btn:hover {
      background: var(--primary-light);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      background: var(--primary-light);
      border: 2px solid transparent;
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-dark);
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.25);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1.5px solid var(--border-color);
      padding: 18px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 280px;
      background: #fffafa;
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      margin-bottom: 12px;
      touch-action: none;
      user-select: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }

    .input-group input {
      width: 70px;
      padding: 8px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-dark);
      outline: none;
    }

    .btn {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: #64748b;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .feedback-box {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.success {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      color: var(--success-green);
    }

    .feedback-box.error {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      color: var(--error-red);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .quiz-opt-btn {
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .quiz-opt-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary-color);
    }

    .quiz-opt-btn.selected-correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: var(--success-green);
    }

    .quiz-opt-btn.selected-wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: var(--error-red);
    }

    .teacher-panel {
      display: none;
      border: 2px solid var(--primary-dark);
      background: #fff;
    }

    .teacher-panel.active {
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--primary-light);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 2px;
    }

    .tip-tag {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge-school">滬江小學 • 數學科</div>
      <button class="mode-switch-btn" id="modeSwitchBtn" onclick="toggleTeacherMode()">切換模式：教師視角</button>
      <h1>3上B 第15課 平行線互動教學平台</h1>
      <p class="subtitle">認識平行的概念與永不相交的特性</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(0)">任務一：等距探究</button>
      <button class="tab-btn" onclick="switchTab(1)">任務二：自由畫平行線</button>
      <button class="tab-btn" onclick="switchTab(2)">任務三：平行線辨析挑戰</button>
    </div>

    <!-- 任務一 -->
    <section class="tab-content active" id="tab0">
      <div class="card">
        <div class="card-title">📐 觀察與量度：量度兩條直線之間的垂直距離</div>
        <div class="tip-tag">提示</div>
        <p style="margin: 4px 0 12px 0; font-size: 0.95rem;">請觀察畫布上的兩條平行直線，分別讀取左端、中間與右端的垂直距離（刻度單位：cm），並在下方填寫：</p>
        
        <div class="canvas-wrapper">
          <canvas id="measureCanvas"></canvas>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="distL">左端距離：</label>
            <input type="number" id="distL" placeholder="0" min="0" step="0.5"> cm
          </div>
          <div class="input-group">
            <label for="distM">中間距離：</label>
            <input type="number" id="distM" placeholder="0" min="0" step="0.5"> cm
          </div>
          <div class="input-group">
            <label for="distR">右端距離：</label>
            <input type="number" id="distR" placeholder="0" min="0" step="0.5"> cm
          </div>
          <button class="btn" onclick="verifyDistances()">核對答案</button>
        </div>

        <div class="feedback-box" id="fbDist"></div>
      </div>
    </section>

    <!-- 任務二 -->
    <section class="tab-content" id="tab1">
      <div class="card">
        <div class="card-title">✏️ 動手嘗試：畫出一組平行線</div>
        <p style="margin: 4px 0 12px 0; font-size: 0.95rem;">畫布上已為你提供了一條粉色基準線。請在下方沿著相同方向畫一條線，保持兩者距離處處相等！</p>
        
        <div class="canvas-wrapper">
          <canvas id="drawCanvas"></canvas>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn btn-secondary" onclick="resetDrawCanvas()">清除重畫</button>
          <button class="btn" onclick="evaluateDrawnLine()">完成驗證</button>
        </div>

        <div class="feedback-box" id="fbDraw"></div>
      </div>
    </section>

    <!-- 任務三 -->
    <section class="tab-content" id="tab2">
      <div class="card">
        <div class="card-title">🎯 辨析挑戰：判斷圖中兩條線是否互相平行</div>
        <div class="canvas-wrapper" style="height: 240px;">
          <canvas id="quizCanvas"></canvas>
        </div>

        <div class="quiz-options" id="quizOptions">
          <button class="quiz-opt-btn" onclick="handleQuizAnswer(true)">這兩條線互相平行（處處等距，永不相交）</button>
          <button class="quiz-opt-btn" onclick="handleQuizAnswer(false)">這兩條線不平行（延長後會相交）</button>
        </div>

        <div style="margin-top: 14px;">
          <button class="btn btn-secondary" onclick="nextQuiz()">下一題</button>
        </div>

        <div class="feedback-box" id="fbQuiz"></div>
      </div>
    </section>

    <!-- 教師監控面板 -->
    <div class="card teacher-panel" id="teacherPanel">
      <div class="card-title">👩‍🏫 教師即時觀察儀表板</div>
      <p id="studentSyncNotice" style="font-size: 0.85rem; color: #64748b; margin-top: -6px; margin-bottom: 12px;">即時統整本堂課學生操作數據與理解情況</p>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statCompletedTasks">0/3</div>
          <div class="stat-label">已完成任務數</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statQuizAccuracy">0%</div>
          <div class="stat-label">挑戰題正確率</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statMisconceptions">0</div>
          <div class="stat-label">非平行線誤判次數</div>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="resetTeacherStats()">重置課堂數據</button>
    </div>
  </div>

  <script>
    let isTeacherMode = false;
    let stats = {
      completedTasks: new Set(),
      quizAttempts: 0,
      quizCorrect: 0,
      misconceptions: 0
    };

    function updateTeacherStatsUI() {
      document.getElementById('statCompletedTasks').innerText = `${stats.completedTasks.size}/3`;
      const acc = stats.quizAttempts > 0 ? Math.round((stats.quizCorrect / stats.quizAttempts) * 100) : 0;
      document.getElementById('statQuizAccuracy').innerText = `${acc}%`;
      document.getElementById('statMisconceptions').innerText = stats.misconceptions;
    }

    function resetTeacherStats() {
      stats.completedTasks.clear();
      stats.quizAttempts = 0;
      stats.quizCorrect = 0;
      stats.misconceptions = 0;
      updateTeacherStatsUI();
      alert('已重置課堂統計數據！');
    }

    function toggleTeacherMode() {
      isTeacherMode = !isTeacherMode;
      const panel = document.getElementById('teacherPanel');
      const btn = document.getElementById('modeSwitchBtn');
      const studentSyncNotice = document.getElementById('studentSyncNotice');

      if (isTeacherMode) {
        panel.classList.add('active');
        btn.innerText = '🔄 返回【學生模式】';
        studentSyncNotice.style.display = 'block';
      } else {
        panel.classList.remove('active');
        btn.innerText = '切換模式：教師視角';
        studentSyncNotice.style.display = 'none';
      }
    }

    function switchTab(idx) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
      document.querySelectorAll('.tab-content').forEach((sec, i) => {
        sec.classList.toggle('active', i === idx);
      });

      if (idx === 0) renderMeasureTask();
      if (idx === 1) renderDrawTask();
      if (idx === 2) loadQuizQuestion();
    }

    function initCanvasResolution(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      return { ctx, width: rect.width, height: rect.height };
    }

    const TARGET_DIST = 4.0;
    function renderMeasureTask() {
      const canvas = document.getElementById('measureCanvas');
      const { ctx, width, height } = initCanvasResolution(canvas);

      ctx.clearRect(0, 0, width, height);

      const y1 = height * 0.35;
      const y2 = height * 0.75;
      const padding = 50;

      // 基準線 1
      ctx.beginPath();
      ctx.strokeStyle = '#ff6b8b';
      ctx.lineWidth = 4;
      ctx.moveTo(padding, y1);
      ctx.lineTo(width - padding, y1);
      ctx.stroke();

      // 基準線 2
      ctx.beginPath();
      ctx.strokeStyle = '#ff6b8b';
      ctx.lineWidth = 4;
      ctx.moveTo(padding, y2);
      ctx.lineTo(width - padding, y2);
      ctx.stroke();

      // 量度輔助虛線及標註
      const points = [
        { x: width * 0.2, label: '4.0 cm' },
        { x: width * 0.5, label: '4.0 cm' },
        { x: width * 0.8, label: '4.0 cm' }
      ];

      points.forEach(pt => {
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.moveTo(pt.x, y1);
        ctx.lineTo(pt.x, y2);
        ctx.stroke();
        ctx.setLineDash([]);

        // 垂直符號
        ctx.strokeStyle = '#64748b';
        ctx.strokeRect(pt.x, y1, 10, 10);
        ctx.strokeRect(pt.x, y2 - 10, 10, 10);

        // 標註距離文字
        ctx.fillStyle = '#1e293b';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pt.label, pt.x + 35, (y1 + y2) / 2);
      });
    }

    function verifyDistances() {
      const l = parseFloat(document.getElementById('distL').value);
      const m = parseFloat(document.getElementById('distM').value);
      const r = parseFloat(document.getElementById('distR').value);
      const fb = document.getElementById('fbDist');

      if (isNaN(l) || isNaN(m) || isNaN(r) || l <= 0 || m <= 0 || r <= 0) {
        fb.className = 'feedback-box show error';
        fb.innerText = '請在所有欄位輸入大於 0 的正確量度數字。';
        return;
      }

      if (l === TARGET_DIST && m === TARGET_DIST && r === TARGET_DIST) {
        fb.className = 'feedback-box show success';
        fb.innerHTML = '🎉 <b>太棒了，完全正確！</b><br>這兩條直線處處距離都保持相等（4.0 cm），因此它們是<b>一組平行線</b>。';
        stats.completedTasks.add(1);
        updateTeacherStatsUI();
      } else {
        fb.className = 'feedback-box show error';
        fb.innerHTML = '距離填寫有誤，請再仔細看看圖中的尺規標註刻度（每處距離都是 4.0 cm 哦！）。';
      }
    }

    let drawPoints = [];
    let isDrawing = false;

    function renderDrawTask() {
      const canvas = document.getElementById('drawCanvas');
      const { ctx, width, height } = initCanvasResolution(canvas);

      ctx.clearRect(0, 0, width, height);

      // 給出一條粉色參考基準線
      ctx.beginPath();
      ctx.strokeStyle = '#ff8da1';
      ctx.lineWidth = 4;
      ctx.moveTo(40, height * 0.3);
      ctx.lineTo(width - 40, height * 0.3);
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = '13px sans-serif';
      ctx.fillText('基準線', 40, height * 0.3 - 10);

      // 繪製用戶筆劃
      if (drawPoints.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3;
        ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
        for (let i = 1; i < drawPoints.length; i++) {
          ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
        }
        ctx.stroke();
      }
    }

    const drawCanvas = document.getElementById('drawCanvas');
    function getCanvasCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    drawCanvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      drawPoints = [getCanvasCoords(e)];
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      drawPoints.push(getCanvasCoords(e));
      renderDrawTask();
    });
    window.addEventListener('mouseup', () => { isDrawing = false; });

    drawCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      drawPoints = [getCanvasCoords(e)];
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      drawPoints.push(getCanvasCoords(e));
      renderDrawTask();
    });
    window.addEventListener('touchend', () => { isDrawing = false; });

    function resetDrawCanvas() {
      drawPoints = [];
      renderDrawTask();
      const fb = document.getElementById('fbDraw');
      fb.className = 'feedback-box';
      fb.innerText = '';
    }

    function evaluateDrawnLine() {
      const fb = document.getElementById('fbDraw');
      if (drawPoints.length < 5) {
        fb.className = 'feedback-box show error';
        fb.innerText = '請在畫布上畫出一條足夠長的直線以進行平行驗證。';
        return;
      }

      const yCoords = drawPoints.map(p => p.y);
      const minY = Math.min(...yCoords);
      const maxY = Math.max(...yCoords);
      const variance = maxY - minY;

      if (variance < 28) {
        fb.className = 'feedback-box show success';
        fb.innerHTML = '✨ <b>非常優秀！</b> 你的線條保持水平延伸，處處與基準線保持等距，成功畫出了平行線！';
        stats.completedTasks.add(2);
        updateTeacherStatsUI();
      } else {
        fb.className = 'feedback-box show error';
        fb.innerHTML = '這條線稍微傾斜或彎曲了，延長後會與基準線相交。請點擊「清除重畫」再試一次！';
      }
    }

    const quizData = [
      { isParallel: true, y1A: 60, y1B: 60, y2A: 140, y2B: 140, tip: '兩條直線處處距離相等，永遠不會相交。' },
      { isParallel: false, y1A: 50, y1B: 90, y2A: 160, y2B: 120, tip: '這兩條直線向右延伸會越來越靠近並相交，因此不是平行線。' },
      { isParallel: true, y1A: 40, y1B: 100, y2A: 90, y2B: 150, tip: '傾斜度相同且間隔恆定，是一組平行的斜線。' },
      { isParallel: false, y1A: 50, y1B: 50, y2A: 120, y2B: 160, tip: '兩線一端距離近、一端距離遠，並非處處等距。' }
    ];
    let currentQuizIdx = 0;

    function loadQuizQuestion() {
      const q = quizData[currentQuizIdx];
      const canvas = document.getElementById('quizCanvas');
      const { ctx, width } = initCanvasResolution(canvas);

      ctx.clearRect(0, 0, width, canvas.height);

      const padding = 60;
      // 線 1
      ctx.beginPath();
      ctx.strokeStyle = '#ff6b8b';
      ctx.lineWidth = 4;
      ctx.moveTo(padding, q.y1A);
      ctx.lineTo(width - padding, q.y1B);
      ctx.stroke();

      // 線 2
      ctx.beginPath();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 4;
      ctx.moveTo(padding, q.y2A);
      ctx.lineTo(width - padding, q.y2B);
      ctx.stroke();

      document.getElementById('fbQuiz').className = 'feedback-box';
      document.querySelectorAll('.quiz-opt-btn').forEach(btn => {
        btn.classList.remove('selected-correct', 'selected-wrong');
      });
    }

    function handleQuizAnswer(userSaysParallel) {
      const q = quizData[currentQuizIdx];
      const fb = document.getElementById('fbQuiz');
      const isCorrect = (userSaysParallel === q.isParallel);

      stats.quizAttempts++;
      if (isCorrect) {
        stats.quizCorrect++;
        fb.className = 'feedback-box show success';
        fb.innerHTML = `🌟 <b>答對了！</b> ${q.tip}`;
      } else {
        if (!q.isParallel && userSaysParallel) {
          stats.misconceptions++;
        }
        fb.className = 'feedback-box show error';
        fb.innerHTML = `❌ <b>思考一下：</b> ${q.tip}`;
      }

      stats.completedTasks.add(3);
      updateTeacherStatsUI();
    }

    function nextQuiz() {
      currentQuizIdx = (currentQuizIdx + 1) % quizData.length;
      loadQuizQuestion();
    }

    window.addEventListener('resize', () => {
      renderMeasureTask();
      renderDrawTask();
      loadQuizQuestion();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderMeasureTask();
    });
  </script>
</body>
</html>
